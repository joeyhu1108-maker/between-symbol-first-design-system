<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BETWEEN · 一场关系的生长</title>
<!-- The opening fan chooses five random cards; warm every seed face before the module graph. -->
<link rel="preload" as="image" href="./assets/print-cards/01-seed.webp" fetchpriority="high">
<link rel="preload" as="image" href="./assets/print-cards/02-seed.webp" fetchpriority="high">
<link rel="preload" as="image" href="./assets/print-cards/03-seed.webp" fetchpriority="high">
<link rel="preload" as="image" href="./assets/print-cards/04-seed.webp" fetchpriority="high">
<link rel="preload" as="image" href="./assets/print-cards/05-seed.webp" fetchpriority="high">
<link rel="preload" as="image" href="./assets/print-cards/06-seed.webp" fetchpriority="high">
<link rel="preload" as="image" href="./assets/print-cards/07-seed.webp" fetchpriority="high">
<link rel="preload" as="image" href="./assets/print-cards/08-seed.webp" fetchpriority="high">
<link rel="preload" as="image" href="./assets/print-cards/09-seed.webp" fetchpriority="high">
<link rel="preload" as="image" href="./assets/print-cards/10-seed.webp" fetchpriority="high">
<link rel="preload" as="image" href="./assets/print-cards/11-seed.webp" fetchpriority="high">
<link rel="preload" as="image" href="./assets/print-cards/12-seed.webp" fetchpriority="high">
<style>
html,body{background:#fcfaf3}
body:not([data-ready]) .app{visibility:hidden}
#bootScreen{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;background:#fcfaf3;color:#777971;font:14px/1.8 sans-serif;text-align:center}
#bootGlyph{width:72px;height:72px}#bootGlyph>img{width:100%;height:100%}
#bootError a{color:inherit;text-underline-offset:4px}
</style>
<link rel="stylesheet" href="./prototype-3d.css?v=physical-symbol-2">
<link rel="stylesheet" href="./entry-garden.css">
<link rel="stylesheet" href="./symbol-interface.css?v=physical-symbol-3">

</head>
<body>
<div id="bootScreen" role="status" aria-label="正在载入花园">
  <div id="bootGlyph" aria-hidden="true"><img src="./motion/vectors/01.svg" alt="" width="72" height="72"></div>
  <p id="bootError" role="alert" hidden>花园暂时未能打开。<a href="">重新加载</a></p>
  <noscript><p>请启用 JavaScript 后重新打开花园。</p></noscript>
</div>
<main class="app" inert>
  <canvas id="scene" aria-label="3D 铸造钥匙游戏场景"></canvas>
  <header class="topbar"><a class="brand" href="./" aria-label="返回当前体验" title="返回当前体验"></a><div id="stageLabel" aria-label="当前阶段"></div></header>
  <section id="entryPanel" class="entry-panel" aria-label="用手机扫码，洗牌并抽一张卡" hidden>
    <div id="entryGarden" class="entry-garden" aria-hidden="true"></div>
    <div class="entry-scene">
      <div class="entry-center">
        <div id="entryGlyph" aria-hidden="true"></div>
        <div id="entryCode" hidden><a id="entryPhoneLink" target="_blank" rel="noopener" aria-label="手机扫码抽一张卡，点击可打开手机入口" title="手机扫码抽一张卡"><img id="entryQr" alt="手机扫码抽卡二维码" width="256" height="256"></a></div>
        <div id="entryWaiting" class="symbol-loading" role="status" aria-label="手机已连接，等待抽卡" hidden><svg class="card-loading-symbol" viewBox="344 1012 112 72" aria-hidden="true"><image href="./assets/print-cards/01-seed.webp" width="800" height="1200"/></svg></div>
        <div class="entry-sequence" aria-label="进入，抽一张卡，再交给另一端"><span data-interface-glyph="01"></span><i></i><span data-interface-glyph="03"></span><i></i><span data-interface-glyph="07"></span></div>
        <div class="entry-actions"><button id="retryEntry" class="ghost" aria-label="刷新二维码" title="刷新二维码" hidden>↻</button><button id="localEntry" class="ghost" aria-label="在电脑上直接抽一张卡" title="在电脑上直接抽一张卡">⌁</button></div>
      </div>
    </div>
    <p id="entryError" role="alert" hidden></p>
  </section>
  <section class="hud left-panel" hidden>
    <h1 aria-label="让一颗种子开始发生"><span id="openingGlyph" aria-hidden="true"></span></h1>
    <div id="seedDeck" class="seed-deck" aria-label="选择一张种子卡"></div>
    <div id="shuffleSymbols" class="symbol-loading shuffle-loading" role="status" aria-label="种子卡正在洗牌" hidden></div>
    <div class="entry-controls">
    <div class="shuffle-controls" aria-label="洗牌方式">
      <button type="button" class="shuffle-mode is-active" data-shuffle-mode="hand" aria-label="AI 手洗牌" title="AI 手洗牌"></button>
      <button type="button" class="shuffle-mode" data-shuffle-mode="slot" aria-label="老虎机滚动" title="老虎机滚动"></button>
      <button type="button" class="shuffle-mode" data-shuffle-mode="converge" aria-label="三合一汇聚" title="三合一汇聚"></button>
      <button type="button" id="startShuffle" class="primary shuffle-start" aria-label="开始洗牌" title="开始洗牌"></button>
    </div>
    </div>
    <p id="status" class="status" aria-live="polite">点击开始洗牌，再翻开一张种子卡。</p>
  </section>
  <section id="selectedPanel" class="selected-panel" aria-label="在线下找到对应符号，触碰实体卡或点击确认" hidden>
    <div class="human-focus">
      <button id="humanFocusCard" class="human-focus-card" type="button" aria-label="翻转查看插画面" aria-pressed="false"></button>
      <div id="humanFocusSymbols" class="human-focus-symbols" aria-hidden="true"></div>
    </div>
    <div class="physical-card-cue" aria-label="找到对应实体卡，用手机触碰" role="img"><svg viewBox="0 0 80 40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="5" width="19" height="29" rx="2"/><path d="m13 20 3-5 3 5-3 5Z"/><path class="tap-wave" d="M34 17a6 6 0 0 1 0 7m4-11a12 12 0 0 1 0 15"/><rect x="50" y="3" width="20" height="34" rx="4"/><path d="M57 7h6m-4 26h2"/></svg></div>
    <p id="selectedError" role="alert" hidden></p>
    <button id="lockInput" class="handoff-action" aria-label="已找到实体卡，开始 AI 抽卡" disabled><svg viewBox="0 0 40 32" aria-hidden="true"><path d="M2 16h12m-4-4 4 4-4 4M28 5c2 7 4 9 11 11-7 2-9 4-11 11-2-7-4-9-11-11 7-2 9-4 11-11Z"/></svg></button>
  </section>
  <section id="aiPanel" class="ai-panel" aria-label="你已抽一张，现在由 AI 从剩余卡牌中抽一张" hidden>
    <div class="ai-duet">
      <div class="ai-player"><div id="humanDraw" class="draw-card"></div></div>
      <div class="ai-transfer"><div id="aiSymbols" class="symbol-loading" role="status" aria-label="AI 正在抽卡"></div></div>
      <div class="ai-player"><div id="aiDeck" class="draw-card" aria-label="剩余卡牌，AI 正在选择"></div></div>
    </div>
  </section>
  <section class="hud print-panel" id="printPanel" hidden>
    <h2 id="printTitle" aria-label="数字孪生正在打印">▧</h2><p id="printCopy" aria-live="polite"></p>
    <img id="printArt" class="generated-art print-art" alt="即将打印的预生成作品" hidden>
    <div class="progress"><i id="printProgress"></i></div><div class="print-meta"><span id="layerText">等待启动</span><span id="percentText">0%</span></div>
    <button id="startPrintButton" class="primary print-button" aria-label="开始 3D 打印预演" title="开始 3D 打印预演">⟶</button>
    <div id="artworkActions" class="artwork-actions" hidden><button id="paperPrint" type="button" aria-label="打印这件作品" hidden></button><a id="downloadArtwork" aria-label="下载作品 PDF" title="下载作品 PDF" download>⇩</a><a id="openPrinter" aria-label="打开作品与纸张打印" title="打开作品与纸张打印" target="_blank" rel="noopener">▧ ↗</a></div>
    <p id="paperPrintError" role="alert" hidden></p>
    <button id="restart" class="ghost" aria-label="再来一次，换人体验">↺</button>
  </section>
  <footer hidden><span id="jobText"></span></footer>
</main>
<script src="./motion/vendor/lottie.min.js"></script>
<script type="module">
let releaseLogo;
try{
  const {mountSymbolLoading,unmountGlyph}=await import('./symbol-interface.js?v=physical-symbol-3');
  const logo=document.querySelector('#bootGlyph');
  mountSymbolLoading(logo);releaseLogo=()=>unmountGlyph(logo);
  await Promise.all([import('./entry-garden.js?v=card-fusion-3d-1'),import('./prototype-3d.js?v=instant-handoff-1')]);
  releaseLogo();
  document.querySelector('.app').inert=false;
  document.body.dataset.ready='true';
  document.querySelector('#bootScreen').remove();
}catch(error){
  releaseLogo?.();
  document.querySelector('#bootGlyph').hidden=true;
  document.querySelector('#bootError').hidden=false;
  console.error('Garden could not load',error);
}
</script>
</body></html>
