<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原版与 V2 对比</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#fff7ed;color:#665774;font:16px system-ui}h1{font-size:24px;font-weight:500}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}video{width:100%;background:#fff7ed;border-radius:12px}figcaption{padding:14px 0}button,a{font:inherit;border:1px solid #ccbcd4;padding:10px 16px;border-radius:20px;background:transparent;color:inherit;cursor:pointer;text-decoration:none;display:inline-block;margin:12px 10px 20px 0}@media(max-width:850px){main{grid-template-columns:1fr}}</style><h1>莫比乌斯环 · 原版与 V2</h1><button id="restart">同时从头播放</button><button id="pause">暂停 / 继续</button><a href="循环播放.html">打开 V2 全屏播放页</a><main><figure><video src="original_lavender_preserved.mp4" autoplay muted loop playsinline controls></video><figcaption>原版 · 淡紫色版（保留）</figcaption></figure><figure><video src="mobius_lavender_v2_airborne.mp4" autoplay muted loop playsinline controls></video><figcaption>V2 · 追逐、转身与悬空阴影优化</figcaption></figure></main><script>const videos=[...document.querySelectorAll('video')];document.querySelector('#restart').onclick=()=>videos.forEach(v=>{v.currentTime=0;v.play()});document.querySelector('#pause').onclick=()=>{const pause=videos.some(v=>!v.paused);videos.forEach(v=>pause?v.pause():v.play())};</script></html>
