<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ed">
  <title>BETWEEN · 确认你的花园</title>
  <link rel="stylesheet" href="./phone.css">
  <link rel="stylesheet" href="./symbol-interface.css?v=loading-sequence-2">
  <style>
    .phone-print .target{position:absolute;z-index:2;top:calc(22px + env(safe-area-inset-top));left:0;right:0;display:grid;justify-items:center;gap:6px;font-size:12px;color:#817b70}
    .phone-print .target-symbol{width:54px;height:54px}
    .phone-print .action{width:auto;min-width:210px;height:52px;padding:0 25px;border-radius:28px;font-size:15px;background:#eeebe3}
    .phone.phone-print[data-view] .action:after{content:none}
    .phone-print .notice{font-size:13px;line-height:1.7;text-align:center;color:#596052;max-width:300px;margin:4px 0}
    .phone-print .controls{z-index:3}
    .phone-print[data-view="submitted"] .controls{top:auto;bottom:calc(32px + env(safe-area-inset-bottom))}
  </style>
</head>
<body>
  <main id="phone" class="phone phone-print" data-view="ready" aria-label="确认本轮答案卡并打印花园">
    <div id="target" class="target" hidden><div id="targetSymbol" class="target-symbol" aria-hidden="true"></div><span>本轮目标符号</span></div>
    <section class="reveal" aria-label="本次碰到的卡片">
      <div id="revealSymbols" class="reveal-symbols" aria-hidden="true"></div>
      <div id="chosenCard" class="chosen-card"></div>
      <div id="handoff" class="handoff" hidden><div id="handoffSymbol" class="symbol-loading" aria-hidden="true"></div></div>
    </section>
    <footer class="controls">
      <div class="action-row"><button id="action" class="action" type="button" aria-label="正在核对本轮作品" disabled>正在核对本轮作品</button></div>
      <p id="notice" class="notice" aria-live="polite" hidden></p>
      <p id="error" class="error" role="alert" hidden></p>
      <p id="status" class="sr-only" aria-live="polite">正在核对本轮作品。</p>
    </footer>
  </main>
  <script src="./motion/vendor/lottie.min.js"></script>
  <script type="module" src="./phone-print.js?v=phone-confirm-1"></script>
</body>
</html>
